fields:
  - key: sampleworks_model
    type: enum
    display_name: Model
    allowed_values: [boltz2, protenix, rf3]
    required: true
  - key: sampleworks_methods
    type: text
    display_name: Methods
  - key: sampleworks_gradient_weights
    type: text
    display_name: Gradient Weights
    default: "0.1 0.2 0.5"
  - key: sampleworks_ensemble_sizes
    type: text
    display_name: Ensemble Sizes
    default: "8"
