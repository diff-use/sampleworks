# diffuse.yaml -- the contract between Sampleworks and Diffuse.
#
# Apply with: diffuse apply
# Run with:   diffuse run start --profile boltz2-xrd
#
# Idempotent -- safe to apply repeatedly.

version: 1

type: sampleworks
name: Sampleworks
description: >
  Protein structure prediction via grid search.
  Runs Boltz2, Protenix, or RoseTTAFold3 models with configurable
  gradient guidance, ensemble sizes, and diffusion parameters.

profiles:
  - slug: boltz2-xrd
    name: Sampleworks Boltz2 (X-Ray Diffraction)
    container:
      image: diffuseproject/sampleworks
      tag: latest
      gpus:
        min: 2
    entrypoint: null
    input_schema:
      inputs:
        - key: proteins_path
          type: text
          default: /data/input/proteins.csv
        - key: models
          type: enum
          required: true
          allowed_values: [boltz2]
          default: boltz2
        - key: methods
          type: text
          default: "X-RAY DIFFRACTION"
        - key: scalers
          type: text
          default: pure_guidance
        - key: partial_diffusion_step
          type: number
          default: 120
        - key: gradient_weights
          type: text
          default: "0.1 0.2 0.5"
        - key: ensemble_sizes
          type: text
          default: "8"
        - key: gradient_normalization
          type: boolean
          default: true
        - key: augmentation
          type: boolean
          default: true
        - key: align_to_input
          type: boolean
          default: true
    run_config_defaults:
      shared_memory_size: "16Gi"
      image_pull_policy: IfNotPresent
      poll_max_retries: 720
      volumes:
        - name: data-input
          hostPath: /mnt/diffuse-private/raw/sampleworks/initial_dataset_40
          mountPath: /data/input
          readOnly: true
        - name: data-results
          hostPath: /home/ubuntu/sampleworks-exp/grid_search_results
          mountPath: /data/results
        - name: msa-cache
          hostPath: /home/ubuntu/sampleworks-exp/msa_cache
          mountPath: /root/.sampleworks/msa
        - name: checkpoints
          hostPath: /mnt/diffuse-private
          mountPath: /mnt/diffuse-private
          readOnly: true
      args_template:
        base_command: [-e, boltz, run_grid_search.py]
        flag_args:
          proteins_path: --proteins
          models: --model
          scalers: --scalers
          partial_diffusion_step: --partial-diffusion-step
          ensemble_sizes: --ensemble-sizes
          gradient_weights: --gradient-weights
          methods: --method
        boolean_args:
          gradient_normalization: --gradient-normalization
          augmentation: --augmentation
          align_to_input: --align-to-input
        static_args: [--output-dir, /data/results]

