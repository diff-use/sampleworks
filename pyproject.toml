[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[dependency-groups]
analysis = [
  "ipython",
  "joblib",
  "marimo",
  "matplotlib",
  "mdtraj",
  "pandas",
  "peppr",
  "polars",
  "pyzmq",
  "scikit-learn",
  "seaborn"
]
dev = ["pytest", "pytest-cov", "mypy", "prek", "ty", "ruff", "pytest-loguru", "python-semantic-release"]
test = ["pytest", "pytest-cov", "pytest-loguru"]

[tool.pixi.feature.boltz]
pypi-dependencies = {"boltz" = "*", "cuequivariance-torch" = "*", "cuequivariance-ops-torch-cu12" = "*", "rdkit" = ">=2025.3.6"}
platforms = ["linux-64"]

[tool.pixi.feature.boltz-osx]
pypi-dependencies = {"boltz" = "*", "cuequivariance-torch" = "*", "rdkit" = ">=2025.3.6"}
platforms = ["osx-arm64"]


[tool.pixi.feature.protenix]
pypi-dependencies = {"protenix" = "*", "einx" = "*", "triton" = "*"}
platforms = ["linux-64"]

# tmol (Rosetta energy fn) as a reward for guided sampling — any strategy, all
# model envs, linux-64. No wheel matches torch 2.7.1, so it builds from source:
# scikit-build-core/pybind11/packaging are PEP517 build deps; build isolation is
# off (see [tool.pixi.pypi-options]) so nvcc sees the env's torch. See TMOL_BUILD.md.
[tool.pixi.feature.tmol]
pypi-dependencies = {"tmol" = "*", "scikit-build-core" = ">=0.10", "pybind11" = ">=2.12", "packaging" = "*"}
platforms = ["linux-64"]

# tmol compiles torch C++/CUDA extensions from source. Three conda-CUDA quirks
# must be papered over for torch's cmake to find everything:
#   1. torch's legacy FindCUDA wants the CUDA root at $PREFIX/targets/<arch>,
#      not $PREFIX (headers live under targets/x86_64-linux/include).
#   2. CUDA 12 dropped the nvToolsExt lib; torch needs header-only NVTX3, which
#      conda's cuda-nvtx does NOT ship — only torch's bundled nvidia-nvtx wheel
#      has the headers. USE_SYSTEM_NVTX=ON + that include dir points cmake at them.
#   3. TMOL_DISABLE_WHEEL_FETCH skips the (futile, no torch-2.7 lane) GitHub probe.
# SKBUILD_CMAKE_DEFINE is scikit-build-core's env channel for -D cmake args.
[tool.pixi.feature.tmol.activation.env]
CUDACXX = "$CONDA_PREFIX/bin/nvcc"
CUDA_PATH = "$CONDA_PREFIX/targets/x86_64-linux"
TMOL_DISABLE_WHEEL_FETCH = "1"
# tmol's CUDA kernels are template-heavy (each nvcc cicc peaks ~3.4 GB) and it
# builds every arch of CMAKE_CUDA_ARCHITECTURES concurrently per file. The default
# 4 archs at ninja's default parallelism OOM-kills the build on memory-capped
# sessions (Wynton caps each user at 48 GB). Fix = few archs + bounded parallelism:
#   * CMAKE_CUDA_ARCHITECTURES=80;86 targets sm_80 (A100, 3 nodes) and sm_86
#     (RTX 3090 / A40, 29 nodes) — everything a `-l compute_cap=80` request can
#     land on. This is passed via CMAKE_ARGS, NOT SKBUILD_CMAKE_DEFINE: the latter
#     splits entries on ';' (a literal '\;' crashes its parser), whereas CMAKE_ARGS
#     is shlex-split on spaces so the ';' arch separator survives. Add archs to run
#     elsewhere (8.9 L40, 9.0 H100) but each extra arch adds a concurrent cicc per
#     file (~3.4 GB), so lower the parallelism below if you do.
#   * 6 ninja jobs at 2 archs ~= 34 GB peak (~2 cicc/job). Must live in
#     activation.env — pixi does not forward shell exports into the build.
CMAKE_BUILD_PARALLEL_LEVEL = "6"
CMAKE_ARGS = "-DCMAKE_CUDA_ARCHITECTURES=80;86"
SKBUILD_CMAKE_DEFINE = "CUDA_TOOLKIT_ROOT_DIR=$CONDA_PREFIX/targets/x86_64-linux;CUDAToolkit_ROOT=$CONDA_PREFIX/targets/x86_64-linux;USE_SYSTEM_NVTX=ON;CMAKE_INCLUDE_PATH=$CONDA_PREFIX/lib/python3.12/site-packages/nvidia/nvtx/include"

[project]
authors = [{email = "karson.chrispens@ucsf.edu", name = "Karson Chrispens"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
  "atomworks[ml]==2.1.1",
  "joblib",
  "einx<0.4",
  "hydra-core",
  "jax",
  "jaxtyping",
  "loguru",
  "omegaconf",
  "python-dotenv",
  "sfcalculator-torch>=0.3.2"
]
description = "Experimentally guided biomolecular ensemble generation."
keywords = ["biomolecular-structure", "crystallography", "diffusion", "ensemble-generation", "protein-structure"]
license = {file = "LICENSE"}
name = "sampleworks"
readme = "README.md"
requires-python = ">= 3.11, <3.14"
version = "0.12.2"

[project.urls]
Changelog = "https://github.com/diff-use/sampleworks/blob/main/CHANGELOG.md"
Homepage = "https://diffuse.science/posts/sampleworks/"
Issues = "https://github.com/diff-use/sampleworks/issues"
Repository = "https://github.com/diff-use/sampleworks"

[project.scripts]
sampleworks-analysis = "sampleworks.runs.analysis_cli:main"
sampleworks-guidance = "sampleworks.cli.guidance:main"
sampleworks-runs = "sampleworks.runs.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/analyses",
  "/CHANGELOG.md",
  "/experiments",
  "/LICENSE",
  "/pyproject.toml",
  "/README.md",
  "/src",
  "/tests"
]

[tool.hatch.build.targets.wheel]
packages = ["src/sampleworks"]

[tool.hatch.build.targets.wheel.force-include]
"analyses" = "analyses"
"experiments" = "experiments"

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
disallow_untyped_defs = false
ignore_missing_imports = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pixi.activation.env]
CUDA_HOME = "$CONDA_PREFIX"
PYTHONNOUSERSITE = "1"

[tool.pixi.dependencies]
ninja = "*"
numpy = "<2.0"
pyarrow = "==17.0.0"

[tool.pixi.target.linux-64.dependencies]
cuda-toolkit = ">=12,<13"
gcc_linux-64 = ">=9,<13"
gxx_linux-64 = ">=9,<13"

[tool.pixi.environments]
analysis = {features = ["analysis"]}
analysis-dev = {features = ["analysis", "dev"]}
boltz = {features = ["boltz", "tmol"]}
boltz-analysis = {features = ["boltz", "analysis", "tmol"]}
boltz-dev = {features = ["boltz", "dev", "tmol"]}
boltz-osx = {features = ["boltz-osx", "dev", "analysis"]}
protenix = {features = ["protenix", "tmol"]}
protenix-dev = {features = ["protenix", "dev", "tmol"]}
rf3 = {features = ["rf3", "tmol"]}
rf3-dev = {features = ["rf3", "dev", "tmol"]}

[tool.pixi.feature.protenix.pypi-options.dependency-overrides]
rdkit = ">=2024.3.5,<2025.9"

[tool.pixi.feature.rf3.pypi-dependencies]
rc-foundry = {editable = true, extras = ["rf3"], git = "https://github.com/k-chrispens/foundry.git"}

[tool.pixi.pypi-dependencies]
sampleworks = {editable = true, path = "."}

# tmol has no PEP517 build backend on PyPI beyond a shim that expects torch at
# build time; disable build isolation so it compiles against the env's torch.
[tool.pixi.pypi-options]
no-build-isolation = ["tmol"]

# Workspace-level override: reciprocalspaceship (sfcalculator-torch transitive dep)
# caps pandas<=2.2.3 in its metadata, but runs fine on 2.3.1; protenix hard-pins
# pandas==2.3.1. Standardize all envs on 2.3.1 to avoid silent downgrades.
[tool.pixi.pypi-options.dependency-overrides]
pandas = "==2.3.1"

[tool.pixi.system-requirements]
cuda = "12"

# Includes slow tests that require GPU or model weights
[tool.pixi.tasks.all-tests]
args = [{arg = "flags", default = ""}]
cmd = "pytest {{ flags }}"

[tool.pixi.tasks.cpu-tests]
cmd = "pytest -m 'not gpu' --cov=sampleworks --cov-report=xml --cov-report=term"

[tool.pixi.tasks.gpu-tests]
cmd = "pytest -m gpu"

# Cross-env tasks use bash to orchestrate across environments because pixi's
# depends-on/alias mechanism only works within a single environment.
# This continues past failures, exits 1 if any env failed.
[tool.pixi.tasks.test-all]
cmd = "f=0; pixi run -e boltz-dev all-tests || f=1; pixi run -e protenix-dev all-tests || f=1; pixi run -e rf3-dev all-tests || f=1; exit $f"

[tool.pixi.tasks.test-fast]
cmd = "f=0; pixi run -e boltz-dev tests || f=1; pixi run -e protenix-dev tests || f=1; pixi run -e rf3-dev tests || f=1; exit $f"

# NOTE: if new model environment is added, we need new entries here
# Per-env: pixi run -e rf3-dev tests "-k integration"
[tool.pixi.tasks.tests]
args = [{arg = "flags", default = ""}]
cmd = "pytest -m 'not slow' {{ flags }}"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "gpu: marks tests that require a GPU runner"
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 100
src = []
target-version = "py312"

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722", "UP015"]
select = ["E", "F", "I001", "UP"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"collections" = "co"
"functools" = "ft"
"itertools" = "it"

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
lines-after-imports = 2
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"*.mo.py" = ["ALL"]

[tool.semantic_release]
allow_zero_version = true
assets = ["pixi.lock"]
build_command = "pixi lock"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.semantic_release.remote]
type = "github"

[tool.ty.environment]
python-version = "3.11"

[[tool.ty.overrides]]
include = ["src/sampleworks/eval/bond_angle_and_length_outlier_eval_script.py"]

[tool.ty.overrides.rules]
possibly-missing-attribute = "ignore"

[tool.ty.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-method-override = "warn"
invalid-parameter-default = "warn"
no-matching-overload = "warn"
not-iterable = "warn"
not-subscriptable = "warn"
too-many-positional-arguments = "warn"
unknown-argument = "warn"
unresolved-attribute = "warn"
# Pre-existing type issues across the codebase; warn instead of error
# so ty runs in CI without blocking PRs while the team fixes them.
unresolved-import = "ignore"
unsupported-operator = "warn"
unused-ignore-comment = "warn"
unused-type-ignore-comment = "warn"
